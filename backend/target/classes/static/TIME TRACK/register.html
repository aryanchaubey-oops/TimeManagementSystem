<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Time Management and Task Prioritization System - Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                ⏱
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Time Management and Task Prioritization System
            </p>

            <p class="welcome-text">
                Create your account to manage tasks and track your time.
            </p>


            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Role -->
                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select id="role" name="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="USER">
                            User
                        </option>

                        <option value="ADMIN">
                            Admin
                        </option>

                    </select>

                </div>


                <!-- Register Button -->
                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
