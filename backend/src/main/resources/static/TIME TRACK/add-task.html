<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Add Task - Time Management and Task Prioritization System
    </title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            ⏱

            <span>
                Time Management
            </span>

        </div>


        <nav>

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="tasks.html">
                📋 My Tasks
            </a>

            <a href="add-task.html"
               class="active">
                ➕ Add Task
            </a>

            <a href="profile.html">
                👤 Profile
            </a>

        </nav>


        <button
            class="logout-button"
            onclick="logout()">

            🚪 Logout

        </button>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="dashboard">


        <!-- HEADER -->

        <div class="dashboard-header">

            <div>

                <h1>
                    Add New Task
                </h1>

                <p>
                    Create a task and set its priority and deadline.
                </p>

            </div>


            <div class="user-info">

                👤

                <span id="addTaskUserName">
                    User
                </span>

            </div>

        </div>



        <!-- FORM -->

        <section class="form-section">

            <div class="form-section-header">

                <h2>
                    Task Information
                </h2>

                <p>
                    Enter the details of your new task.
                </p>

            </div>


            <form id="addTaskForm">


                <!-- TASK NAME -->

                <div class="form-group">

                    <label for="taskName">
                        Task Name
                    </label>

                    <input
                        type="text"
                        id="taskName"
                        name="taskName"
                        placeholder="Enter task name"
                        required>

                </div>



                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Enter task description"></textarea>

                </div>



                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Task Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>

                        <option value="">
                            Select category
                        </option>

                    </select>

                </div>



                <!-- TWO COLUMN -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="deadline">
                            Deadline
                        </label>

                        <input
                            type="date"
                            id="deadline"
                            name="deadline"
                            required>

                    </div>



                    <div class="form-group">

                        <label for="importance">
                            Importance Level
                        </label>

                        <select
                            id="importance"
                            name="importance"
                            required>

                            <option value="">
                                Select importance
                            </option>

                            <option value="Critical">
                                Critical
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Low">
                                Low
                            </option>

                        </select>

                    </div>

                </div>



                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        Task Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        required>

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>



                <!-- BUTTONS -->

                <div class="form-actions">

                    <a
                        href="tasks.html"
                        class="cancel-button">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="save-task-button">

                        ➕ Create Task

                    </button>

                </div>


            </form>

        </section>


    </main>


    <script src="js/tasks.js"></script>


    <script>

        const addTaskUserName =
            document.getElementById(
                "addTaskUserName"
            );

        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "currentUser"
                )
            );

        if (
            currentUser &&
            addTaskUserName
        ) {

            addTaskUserName.textContent =
                currentUser.name;

        }

    </script>

</body>

</html>
